# This is a basic workflow that is manually triggered
name: Run Jupyter Notebook

# Esto dice que el código debe ejecutarse todos los días a media noche
on:
  workdflow-dispatch:
  schedule:
    - cron: 0 0 * * *

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Los pasos involucrados en la ejecución del trabajo
    steps:
      # Runs a single command using the runners shell
      - name: Establecer version de python
        uses: actions/setup-python@v2
        with:
          python-version: 3.14
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr Notebook
        run: jupyter execute generacion_base_semanal.ipynb
